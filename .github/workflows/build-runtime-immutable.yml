name: Build SM80 SM120 Runtime Image

on:
  push:
    branches:
      - experiment/phase1-image
    paths:
      - ".github/workflows/build-runtime-immutable.yml"
      - "docker/Dockerfile.runtime-immutable"
      - "docker/Dockerfile.runtime-immutable.dockerignore"
      - "docker/runtime-serve.sh"
      - "python/sglang/srt/layers/activation.py"
      - "python/sglang/srt/layers/layernorm.py"
      - "python/sglang/srt/layers/sm75_compat.py"
      - "test/registered/unit/layers/test_sm75_compat.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e
        with:
          version: v0.20.3

      - name: Build runtime wrapper layer
        run: |
          set -euo pipefail
          layer_root="${RUNNER_TEMP}/runtime-layer"
          mkdir -p "${layer_root}/usr/local/bin"
          install -m 0755 \
            docker/runtime-serve.sh \
            "${layer_root}/usr/local/bin/sglang-runtime-serve"
          python3 test/registered/unit/layers/test_sm75_compat.py
          tar \
            --format=posix \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            -C "${layer_root}" \
            -cf "${RUNNER_TEMP}/runtime-layer.tar" \
            .

      - name: Assemble and push immutable runtime image
        run: |
          set -euo pipefail
          base="lmsysorg/sglang:v0.5.15.post1-cu130-runtime@sha256:247fd6bfcdeabe3e382da5c557537440148d08fd30f2b482f01fa09e242fe185"
          image="ghcr.io/ccdd2023/sglang:runtime-${GITHUB_SHA}"
          crane mutate \
            --platform linux/amd64 \
            --append "${RUNNER_TEMP}/runtime-layer.tar" \
            --label "org.opencontainers.image.source=https://github.com/ccdd2023/sglang" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=SGLang SM80/SM120 immutable runtime" \
            --env "HF_HUB_DISABLE_TELEMETRY=1" \
            --env "PYTHONPATH=/workspace/sglang/python" \
            --env "SGLANG_GIT_SHA=${GITHUB_SHA}" \
            --workdir "/workspace/sglang" \
            --cmd "bash" \
            --tag "${image}" \
            "${base}"
          crane copy "${image}" "ghcr.io/ccdd2023/sglang:runtime-phase1"

      - name: Validate config and publish image reference
        run: |
          set -euo pipefail
          base="lmsysorg/sglang:v0.5.15.post1-cu130-runtime@sha256:247fd6bfcdeabe3e382da5c557537440148d08fd30f2b482f01fa09e242fe185"
          image="ghcr.io/ccdd2023/sglang:runtime-${GITHUB_SHA}"
          crane config "${image}" > image-config.json
          jq -e --arg sha "${GITHUB_SHA}" '
            .architecture == "amd64"
            and .config.WorkingDir == "/workspace/sglang"
            and .config.Cmd == ["bash"]
            and .config.Labels["org.opencontainers.image.revision"] == $sha
            and any(.config.Env[]; . == "PYTHONPATH=/workspace/sglang/python")
          ' image-config.json
          digest="$(crane digest "${image}")"
          base_platform_digest="$(crane digest --platform linux/amd64 "${base}")"
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "base=${base}"
            echo "base_platform_digest=${base_platform_digest}"
            echo "image=${image}"
            echo "digest=${digest}"
            echo "platform=linux/amd64"
            echo "cuda_profile=cu130"
            echo "validation=source-and-image-config"
          } | tee image-reference.txt

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-reference
          path: |
            image-reference.txt
            image-config.json
