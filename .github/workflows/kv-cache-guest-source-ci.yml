name: KV Cache Guest Source CI

on:
  push:
    branches: [latest-main]
  pull_request:
    paths:
      - ".github/workflows/kv-cache-guest-source-ci.yml"
      - "benchmark/approx_kv/**"
      - "python/sglang/srt/layers/activation.py"
      - "python/sglang/srt/layers/layernorm.py"
      - "python/sglang/srt/layers/sm75_compat.py"
      - "python/sglang/srt/managers/schedule_batch.py"
      - "python/sglang/srt/mem_cache/approx_kv/**"
      - "python/sglang/srt/mem_cache/radix_cache.py"
      - "test/registered/unit/benchmark/test_approx_kv_workloads.py"
      - "test/registered/unit/layers/test_sm75_compat.py"
      - "test/registered/unit/mem_cache/test_approx_kv_core.py"
      - "test/registered/unit/mem_cache/test_approx_kv_integration_source.py"
      - "test/registered/unit/mem_cache/test_approx_kv_recovery.py"
      - "test/registered/unit/mem_cache/test_approx_kv_scheduler.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile changed Python files
        run: |
          python -m compileall -q \
            benchmark/approx_kv \
            python/sglang/srt/layers/activation.py \
            python/sglang/srt/layers/layernorm.py \
            python/sglang/srt/layers/sm75_compat.py \
            python/sglang/srt/managers/schedule_batch.py \
            python/sglang/srt/mem_cache/approx_kv \
            python/sglang/srt/mem_cache/radix_cache.py \
            test/registered/unit/benchmark/test_approx_kv_workloads.py \
            test/registered/unit/layers/test_sm75_compat.py \
            test/registered/unit/mem_cache/test_approx_kv_core.py \
            test/registered/unit/mem_cache/test_approx_kv_integration_source.py \
            test/registered/unit/mem_cache/test_approx_kv_recovery.py \
            test/registered/unit/mem_cache/test_approx_kv_scheduler.py

      - name: Run source-level tests
        run: |
          python test/registered/unit/layers/test_sm75_compat.py
          python test/registered/unit/mem_cache/test_approx_kv_core.py
          python test/registered/unit/mem_cache/test_approx_kv_integration_source.py
          python test/registered/unit/mem_cache/test_approx_kv_recovery.py
          python test/registered/unit/mem_cache/test_approx_kv_scheduler.py
          python test/registered/unit/benchmark/test_approx_kv_workloads.py
