name: Build SM75 Immutable Image

on:
  push:
    branches:
      - experiment/phase1-image
    paths:
      - ".github/workflows/build-sm75-immutable.yml"
      - "docker/Dockerfile.sm75-immutable"
      - "docker/Dockerfile.sm75-immutable.dockerignore"
      - "docker/sm75-serve.sh"
      - "python/sglang/srt/layers/activation.py"
      - "python/sglang/srt/layers/layernorm.py"
      - "python/sglang/srt/layers/sm75_compat.py"
      - "test/registered/unit/layers/test_sm75_compat.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-sm75-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Maximize build disk
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable SM75 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sm75-immutable
          load: true
          tags: |
            ghcr.io/ccdd2023/sglang:sm75-${{ github.sha }}
            ghcr.io/ccdd2023/sglang:sm75-phase1
          build-args: |
            SGLANG_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=sm75-phase1
          cache-to: type=gha,mode=max,scope=sm75-phase1
          provenance: false

      - name: Validate mounted latest source
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,size=256m \
            --tmpfs /root:rw,size=256m \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -v "${GITHUB_WORKSPACE}:/workspace/sglang:ro" \
            "ghcr.io/ccdd2023/sglang:sm75-${GITHUB_SHA}" \
            bash -lc '
              python3 -m compileall -q \
                python/sglang/srt/layers/activation.py \
                python/sglang/srt/layers/layernorm.py \
                python/sglang/srt/layers/sm75_compat.py \
                test/registered/unit/layers/test_sm75_compat.py
              python3 test/registered/unit/layers/test_sm75_compat.py
            '

      - name: Push validated images
        run: |
          docker push "ghcr.io/ccdd2023/sglang:sm75-${GITHUB_SHA}"
          docker push "ghcr.io/ccdd2023/sglang:sm75-phase1"

      - name: Publish image reference
        run: |
          digest="$(
            docker buildx imagetools inspect \
              "ghcr.io/ccdd2023/sglang:sm75-${GITHUB_SHA}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"'
          )"
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "image=ghcr.io/ccdd2023/sglang:sm75-${GITHUB_SHA}"
            echo "digest=${digest}"
          } | tee image-reference.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sm75-image-reference
          path: image-reference.txt
